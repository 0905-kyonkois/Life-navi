function upStatus(s){$('upStatus').textContent=s||'';}
function upClean(row){return {...row,start_time:upClock(row.start_time),end_time:upClock(row.end_time),url:row.url||'',note:row.note||''}}
async function upRequest(method,path,body){if(!await ensureSession())throw new Error('ログインが必要です');const r=await fetch(`${SUPABASE_URL}/rest/v1/life_navi_upcoming_events${path}`,{method,headers:authHeaders({'Prefer':'return=representation'}),body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});if(!r.ok){let t=await r.text();throw new Error('今後の予定の同期エラー '+r.status+'：'+t.slice(0,110))}return await r.json()}
async function syncUpcoming(seedIfEmpty=false){if(!sbSession?.access_token)return;if(upLoading)return;upLoading=true;try{let rows=await upRequest('GET','?select=*&order=date.asc.nullslast,id.asc');if(seedIfEmpty&&!rows.length){rows=await upRequest('POST','',UP_SEEDS)}upEvents=rows.map(upClean);upSynced=true;renderUpcoming()}catch(e){upStatus(e.message);throw e}finally{upLoading=false}}
function upDateDisplay(v){if(!v)return {month:'未定',day:'?',dow:'日程未定'};const d=new Date(v+'T12:00:00');return {month:(d.getMonth()+1)+'月',day:d.getDate(),dow:['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'][d.getDay()]}}
function upCard(ev){const k=upDateDisplay(ev.date),article=document.createElement('article');article.className='up-event '+(ev.category||'other')+' '+(ev.display_size==='compact'?'compact':'');const date=document.createElement('div');date.className='up-datebox';date.innerHTML=`<div class="up-month">${upEscape(k.month)}</div><div class="up-day">${upEscape(k.day)}</div><div class="up-weekday">${upEscape(k.dow)}</div>`;article.appendChild(date);const info=document.createElement('div');info.className='up-info';info.setAttribute('role','button');info.tabIndex=0;const a=document.createElement('div');a.className='up-name';a.textContent=ev.title;info.appendChild(a);if(ev.start_time||ev.end_time){const t=document.createElement('div');t.className='up-time';t.textContent=ev.start_time?(ev.start_time+(ev.end_time?'〜'+ev.end_time:'')):(ev.end_time||'');info.appendChild(t)}if(ev.note){const n=document.createElement('div');n.className='up-note';n.textContent=ev.note;info.appendChild(n)}info.onclick=()=>openUpForm(ev);info.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openUpForm(ev)}};article.appendChild(info);if(ev.category==='oshi'&&/^https?:\/\//i.test(ev.url||'')){const btn=document.createElement('a');btn.className='up-external';btn.textContent='›';btn.href=ev.url;btn.target='_blank';btn.rel='noopener noreferrer';btn.setAttribute('aria-label','関連ページを開く');article.appendChild(btn)}else{const b=document.createElement('button');b.className='up-more';b.textContent='⋯';b.setAttribute('aria-label','詳細・編集');b.onclick=()=>openUpForm(ev);article.appendChild(b)}return article}
function upSection(root,heading,items){if(!items.length)return;const h=document.createElement('h2');h.className='up-section-title';h.textContent=heading;root.appendChild(h);for(const x of items)root.appendChild(upCard(x))}
function renderUpcoming(){const root=$('upEvents');if(!root)return;root.replaceChildren();$('upYear').textContent=upYear+'年';$('upListTab').classList.toggle('selected',upMode==='list');$('upCalTab').classList.toggle('selected',upMode==='calendar');const sorted=upEvents.filter(x=>x.date&&Number(x.date.slice(0,4))===upYear).sort((a,b)=>a.date.localeCompare(b.date)||(a.start_time||'').localeCompare(b.start_time||''));if(upMode==='list'){let last='';sorted.forEach(ev=>{const m=ev.date.slice(5,7);if(m!==last){const h=document.createElement('h2');h.className='up-section-title';h.textContent=Number(m)+'月';root.appendChild(h);last=m}root.appendChild(upCard(ev))});if(!sorted.length){const p=document.createElement('p');p.className='up-empty';p.textContent='この年の予定はまだありません';root.appendChild(p)}upSection(root,'日程未定',upEvents.filter(x=>!x.date&&(upYear===2027||upYear===new Date().getFullYear())))}else{const nav=document.createElement('div');nav.className='up-calendar-head';nav.innerHTML='<button aria-label="前の月">‹</button><strong></strong><button aria-label="次の月">›</button>';nav.querySelector('strong').textContent=(upMonth+1)+'月';nav.children[0].onclick=()=>shiftUpMonth(-1);nav.children[2].onclick=()=>shiftUpMonth(1);root.appendChild(nav);const grid=document.createElement('div');grid.className='up-calendar';['日','月','火','水','木','金','土'].forEach(w=>{const h=document.createElement('div');h.className='up-cal-week';h.textContent=w;grid.appendChild(h)});const offset=new Date(upYear,upMonth,1).getDay(),length=new Date(upYear,upMonth+1,0).getDate();for(let i=0;i<offset;i++)grid.appendChild(document.createElement('div'));for(let n=1;n<=length;n++){const date=`${upYear}-${pad(upMonth+1)}-${pad(n)}`,events=sorted.filter(x=>x.date===date);const b=document.createElement('button');b.className='up-cal-day'+(events.length?' has':'')+(upSelectedDay===date?' picked':'');b.innerHTML=`<div class="up-cal-num">${n}</div>`;const dots=document.createElement('div');dots.className='up-cal-dots';[...new Set(events.map(x=>x.category))].slice(0,3).forEach(c=>{const dot=document.createElement('i');dot.className=c;dots.appendChild(dot)});b.appendChild(dots);b.onclick=()=>{upSelectedDay=date;renderUpcoming()};grid.appendChild(b)}root.appendChild(grid);const date=upSelectedDay&&upSelectedDay.slice(0,7)===`${upYear}-${pad(upMonth+1)}`?upSelectedDay:`${upYear}-${pad(upMonth+1)}-${pad(new Date().getDate())}`;upSection(root,Number(date.slice(5,7))+'月'+Number(date.slice(8,10))+'日の予定',sorted.filter(x=>x.date===date));upSection(root,'この月の予定',sorted.filter(x=>x.date.slice(5,7)===pad(upMonth+1)&&x.date!==date));upSection(root,'日程未定',upEvents.filter(x=>!x.date&&upYear===2027))}if(!sbSession?.access_token)upStatus('プレビュー表示中：設定からSupabaseにログインすると同期できます');else if(upSynced)upStatus('☁ Supabaseと同期済み');}
function shiftUpMonth(delta){const d=new Date(upYear,upMonth+delta,1);upYear=d.getFullYear();upMonth=d.getMonth();upSelectedDay=null;renderUpcoming()}
function openUpForm(ev=null){upEditingId=ev?.id??null;$('upModalTitle').textContent=ev?'予定を編集':'予定を追加';$('upTitleInput').value=ev?.title||'';$('upDateInput').value=ev?.date||'';$('upEndDateInput').value=ev?.end_date||'';$('upStartInput').value=ev?.start_time||'';$('upEndInput').value=ev?.end_time||'';$('upCategory').value=ev?.category||'oshi';$('upSize').value=ev?.display_size||'main';$('upNote').value=ev?.note||'';$('upUrl').value=ev?.url||'';$('upDelete').hidden=!ev||String(ev.id).startsWith('seed-');updateUpUrl();$('upModal').classList.add('open');$('upModal').setAttribute('aria-hidden','false')}
function closeUpForm(){$('upModal').classList.remove('open');$('upModal').setAttribute('aria-hidden','true')}
function updateUpUrl(){$('upUrlRow').style.display=$('upCategory').value==='oshi'?'grid':'none'}
$('upCategory').onchange=updateUpUrl;$('openUpcoming').onclick=()=>{$('upcomingPanel').classList.add('open');$('upcomingPanel').setAttribute('aria-hidden','false');renderUpcoming();if(sbSession?.access_token)syncUpcoming(true).catch(()=>{})};$('closeUpcoming').onclick=()=>{$('upcomingPanel').classList.remove('open');$('upcomingPanel').setAttribute('aria-hidden','true')};$('addUpcoming').onclick=()=>openUpForm();$('upCancel').onclick=closeUpForm;$('upListTab').onclick=()=>{upMode='list';localStorage.setItem('lifeNaviUpMode',upMode);renderUpcoming()};$('upCalTab').onclick=()=>{upMode='calendar';localStorage.setItem('lifeNaviUpMode',upMode);renderUpcoming()};$('upPrevYear').onclick=()=>{upYear--;upSelectedDay=null;renderUpcoming()};$('upNextYear').onclick=()=>{upYear++;upSelectedDay=null;renderUpcoming()};
$('upForm').onsubmit=async e=>{e.preventDefault();if(!sbSession?.access_token){alert('保存するには、設定からSupabaseへログインしてください');return}const data={title:$('upTitleInput').value.trim(),date:$('upDateInput').value||null,end_date:$('upEndDateInput').value||null,start_time:$('upStartInput').value||null,end_time:$('upEndInput').value||null,category:$('upCategory').value,display_size:$('upSize').value,note:$('upNote').value.trim(),url:$('upCategory').value==='oshi'?$('upUrl').value.trim():''};if(!data.title)return;if(data.end_date&&!data.date){alert('終了日を設定する場合は開始日も入力してください');return}if(data.date&&data.end_date&&data.end_date<data.date){alert('終了日は開始日以降にしてください');return}if(data.url&&!/^https?:\/\//i.test(data.url)){alert('関連URLは https:// または http:// で入力してください');return}const save=$('upForm').querySelector('.up-save');save.disabled=true;try{if(upEditingId&&String(upEditingId).startsWith('seed-')){await upRequest('POST','',data)}else if(upEditingId){await upRequest('PATCH','?id=eq.'+encodeURIComponent(upEditingId),data)}else await upRequest('POST','',data);closeUpForm();await syncUpcoming(false)}catch(ex){alert(ex.message)}finally{save.disabled=false}};
$('upDelete').onclick=async()=>{if(!upEditingId||String(upEditingId).startsWith('seed-'))return;if(!confirm('この今後の予定を削除しますか？ 日々のスケジュールは変更しません。'))return;try{await upRequest('DELETE','?id=eq.'+encodeURIComponent(upEditingId));closeUpForm();await syncUpcoming(false)}catch(e){alert(e.message)}};
</script></body></html>
