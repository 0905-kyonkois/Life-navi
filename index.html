ng:16px;font-weight:850;font-size:15px;margin:2px 0 18px}.section{font-size:18px;font-weight:900;margin:24px 3px 10px}.item{display:grid;grid-template-columns:58px 1fr 34px;gap:8px;align-items:center;padding:14px 2px;border-bottom:1px solid #eee}.item:last-child{border:0}.it{font-size:13px;font-weight:800;color:#666}.in{font-weight:800}.check{width:28px;height:28px;border-radius:50%;border:1.5px solid #d3d5db;background:#fff}.done .in{text-decoration:line-through;color:#aaa}.done .check{background:#17181c;color:#fff}.settings{position:fixed;inset:0;background:#f4f5f9;z-index:20;padding:24px;display:none}.settings.open{display:block}.settings h2{margin:20px 0}.settingrow{background:white;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;font-weight:800}.switch{width:52px;height:30px;background:#ddd;border:0;border-radius:99px;padding:3px}.switch span{display:block;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:#17181c}.switch.on span{transform:translateX(22px)}

}

.app{max-width:none;padding:calc(12px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom));min-height:100svh}.top{min-height:46px}.brand{font-size:15px}.iconbtn{min-height:44px;padding:10px 13px}.hero{padding:14px 0 14px}.clock{font-size:clamp(56px,17vw,72px);font-weight:700;letter-spacing:-3px}.date{margin-top:7px;font-size:13px}.count-label{margin-top:20px}.count-number{font-size:clamp(44px,14vw,60px);font-weight:700}.count-small{font-size:17px}.count-seconds{font-size:clamp(40px,12vw,54px);font-weight:700}.card{border-radius:20px;padding:17px;margin-bottom:11px}.now-title{font-size:22px}.focus{min-height:52px;margin:1px 0 12px}.section{margin-top:19px}.item{grid-template-columns:52px 1fr 44px;padding:12px 0}.check{width:40px;height:40px}.settings{padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}.settingrow{min-height:60px}.switch{min-width:52px;min-height:30px}}

</style></head><body><main class="app"><div class="top"><div class="brand">生活ナビ <span class="version">v0.11</span></div><button class="iconbtn" id="settingsBtn">⚙ 設定</button></div><section class="hero"><div class="clock" id="clock"></div><div class="date" id="date"></div><div class="count-label" id="countLabel">次の予定まで</div><div class="countdown" id="countdown">--</div></section><section class="card"><div class="eyebrow">NOW · 今やること</div><div class="now-title" id="nowTitle"></div><div class="sub" id="nowSub"></div><div class="progress"><div class="bar" id="bar"></div></div></section><button class="focus" id="focusBtn">↔ 横全画面で集中する</button><div class="section">今日の予定</div><section class="card" id="list"></section></main>
<div class="settings" id="settings"><button class="iconbtn" id="closeSettings">← 戻る</button><h2>設定</h2><div class="settingrow"><span>時計に秒を表示</span><button class="switch" id="secondsSwitch"><span></span></button></div></div>
<div id="focusView"><div class="fclock" id="fclock"></div><button class="exit" id="exitFocus">×</button><div class="fcenter"><div class="fname" id="fname"></div><div class="fremain" id="fremain"></div><div class="flabel" id="flabel">残り時間</div></div><div class="fnext" id="fnext"></div></div>
<script>
const sample=[{name:'生活ナビ制作①',start:'17:00',end:'18:00',done:false},{name:'数学Ⅱ',start:'18:00',end:'18:30',done:false},{name:'生活ナビ制作②',start:'18:30',end:'19:10',done:false},{name:'配信準備',start:'19:10',end:'19:25',done:false},{name:'配信待機',start:'19:25',end:'19:30',done:false},{name:'配信',start:'19:30',end:'21:00',done:false},{name:'夕食',start:'21:00',end:'22:00',done:false}];
let old=JSON.parse(localStorage.getItem('lifeNaviItems')||'null');let items=old&&['0.3','0.4','0.5'].includes(localStorage.getItem('lifeNaviVersion'))?old:structuredClone(sample);localStorage.setItem('lifeNaviVersion','0.5');localStorage.setItem('lifeNaviItems',JSON.stringify(items));let showSeconds=localStorage.getItem('lifeNaviSeconds')==='1';const $=x=>document.getElementById(x),sec=t=>{let[a,b]=t.split(':').map(Number);return a*3600+b*60},pad=n=>String(n).padStart(2,'0');function fmt(s){s=Math.max(0,Math.floor(s));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`}function state(){let d=new Date(),s=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),active=items.find(x=>!x.done&&s>=sec(x.start)&&s<sec(x.end)),next=items.find(x=>!x.done&&sec(x.start)>s);return{d,s,active,next}}
function render(){let{d,s,active,next}=state();$('clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',...(showSeconds?{second:'2-digit'}:{})});$('date').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(d);if(active){let left=sec(active.end)-s;$('countLabel').textContent='終了まで';$('countdown').innerHTML=left<60?`<span class="count-small">あと</span><span class="count-seconds">${pad(Math.floor(left/60))}:${pad(left%60)}</span>`:`<span class="count-small">あと</span><span class="count-number">${Math.ceil(left/60)}</span><span class="count-small">分</span>`;$('nowTitle').textContent=active.name;$('nowSub').textContent=`${active.start} – ${active.end}`;$('bar').style.width=Math.min(100,(s-sec(active.start))/(sec(active.end)-sec(active.start))*100)+'%'}else if(next){let left=sec(next.start)-s;$('countLabel').textContent='次の予定まで';$('countdown').innerHTML=left<60?`<span class="count-small">あと</span><span class="count-seconds">${pad(Math.floor(left/60))}:${pad(left%60)}</span>`:`<span class="count-small">あと</span><span class="count-number">${Math.ceil(left/60)}</span><span class="count-small">分</span>`;$('nowTitle').textContent='自由時間';$('nowSub').textContent=`次は ${next.start} ${next.name}`;$('bar').style.width='0'}else{$('countLabel').textContent='今日の予定';$('countdown').textContent='終了！';$('nowTitle').textContent='おつかれさま！';$('nowSub').textContent='今日の予定は全部終了';$('bar').style.width='100%'}$('list').innerHTML='';items.forEach(x=>{let e=document.createElement('div');e.className='item'+(x.done?' done':'');e.innerHTML=`<div class="it">${x.start}</div><div><div class="in">${x.name}</div></div><button class="check">${x.done?'✓':''}</button>`;e.querySelector('button').onclick=()=>{x.done=!x.done;localStorage.setItem('lifeNaviItems',JSON.stringify(items));render()};$('list').appendChild(e)});renderFocus()}
function renderFocus(){let{d,s,active,next}=state();$('fclock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});if(active){$('fname').textContent=active.name;$('fremain').textContent=fmt(sec(active.end)-s);$('flabel').textContent='残り時間';let n=items.find(x=>!x.done&&sec(x.start)>=sec(active.end));$('fnext').textContent=n?`NEXT  ${n.start}  ${n.name}`:'NEXT  今日の予定は終了'}else if(next){$('fname').textContent='次の予定まで';$('fremain').textContent=fmt(sec(next.start)-s);$('flabel').textContent='';$('fnext').textContent=`NEXT  ${next.start}  ${next.name}`}else{$('fname').textContent='今日もおつかれさま';$('fremain').textContent='00:00:00';$('flabel').textContent='';$('fnext').textContent='今日の予定は終了'}}
$('settingsBtn').onclick=()=>$('settings').classList.add('open');$('closeSettings').onclick=()=>$('settings').classList.remove('open');function syncSwitch(){$('secondsSwitch').classList.toggle('on',showSeconds)}$('secondsSwitch').onclick=()=>{showSeconds=!showSeconds;localStorage.setItem('lifeNaviSeconds',showSeconds?'1':'0');syncSwitch();render()};syncSwitch();$('focusBtn').onclick=async()=>{const fv=$('focusView');fv.classList.add('show');const portrait=matchMedia('(orientation: portrait)').matches;let locked=false;try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock('landscape');locked=true}}catch(e){}if(!locked&&portrait)fv.classList.add('force-landscape')};async function exitFocusMode(e){if(e){e.preventDefault();e.stopPropagation()}$('focusView').classList.remove('show','force-landscape');try{screen.orientation?.unlock?.()}catch(_){}if(document.fullscreenElement){try{await document.exitFullscreen()}catch(_){}}} $('exitFocus').addEventListener('click',exitFocusMode);$('exitFocus').addEventListener('touchend',exitFocusMode,{passive:false});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&!$('focusView').classList.contains('force-landscape'))$('focusView').classList.remove('show')});if('serviceWorker' in navigator){
let refreshing=false;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});
window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await reg.update();setInterval(()=>reg.update().catch(()=>{}),60000)}catch(e){}});
}
render();setInterval(render,1000);
</script></body></html>
